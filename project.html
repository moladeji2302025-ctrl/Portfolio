<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Project details for MofeOluwa Oladeji portfolio." />
  <title id="project-title">Project | MofeOluwa Oladeji</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="preload" href="./fonts/Surgena.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="./styles.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2D0HS9BVYL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2D0HS9BVYL');
    document.addEventListener('click', function (event) {
      var target = event.target.closest('a, button, [role="button"]');
      if (!target) return;
      var href = target.tagName === 'A' ? (target.getAttribute('href') || '') : '';
      var text = (target.textContent || target.getAttribute('aria-label') || '').trim().replace(/\s+/g, ' ').slice(0, 100);
      gtag('event', 'element_click', { element_tag: target.tagName.toLowerCase(), element_text: text, element_id: target.id || '', link_url: href, page_path: window.location.pathname });
      if (target.classList.contains('tab')) gtag('event', 'filter_select', { filter_value: target.dataset.filter || 'all' });
      if (target.id === 'mobile-menu-toggle') gtag('event', 'mobile_menu_toggle', {});
    }, true);
  </script>
</head>
<body>
  <div class="page-loader" id="pageLoader" aria-hidden="true"></div>
  <script>
    try {
      var storedTheme = localStorage.getItem('mo-theme') || 'light';
      document.documentElement.setAttribute('data-theme', storedTheme);
    } catch (e) {}
    try {
      if (sessionStorage.getItem('mo-nav') === '1') {
        document.getElementById('pageLoader').classList.add('is-active', 'is-instant');
        sessionStorage.removeItem('mo-nav');
      }
    } catch (e) {}
  </script>

  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html#home" class="logo">MOFEOLUWA OLADEJI</a>
      <nav class="nav-links">
        <a class="nav-link" href="index.html#work">Work</a>
        <a class="nav-link" href="index.html#about">About</a>
        <a class="nav-link" href="index.html#contact">Contact</a>
      </nav>
      <div class="header-tools">
        <button id="theme-switch" class="theme-switch" role="switch" aria-checked="false" aria-label="Toggle light and dark mode">
          <span class="theme-switch-thumb"></span>
        </button>
        <button id="mobile-menu-toggle" class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <div id="mobile-menu" class="mobile-menu">
    <a href="index.html#work">Work</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </div>

  <main>
    <section class="section detail-hero">
      <div class="container reveal" data-animate>
        <span class="section-label">Project</span>
        <h1 class="section-title" id="project-heading">Project Title</h1>
        <div class="detail-meta">
          <span class="tag-pill" id="project-category">Category</span>
          <span class="tag-pill" id="project-date">Date</span>
        </div>
        <p class="section-kicker" id="project-summary"></p>
      </div>
      <div class="container detail-visual" id="project-media"></div>
      <div class="container detail-meta" id="project-variants" style="margin-top: 1rem;"></div>
    </section>

    <section class="section">
      <div class="container detail-layout">
        <article class="reveal" data-animate>
          <div class="section-heading">
            <span class="section-label">Project</span>
            <h2 class="section-title">Overview</h2>
          </div>
          <p id="project-description" class="muted"></p>

          <div class="section-heading" style="margin-top:1.6rem;">
            <span class="section-label">Tools</span>
            <h3 class="section-title" style="font-size:2.4rem;">Used</h3>
          </div>
          <ul id="project-tools" class="detail-meta"></ul>

          <div class="section-heading" style="margin-top:1.6rem;">
            <span class="section-label">Explore</span>
            <h3 class="section-title" style="font-size:2.4rem;">More categories</h3>
          </div>
          <div id="other-categories-list" class="detail-meta"></div>
        </article>

        <aside id="project-gallery-section" class="reveal" data-animate>
          <div class="section-heading">
            <span class="section-label">Gallery</span>
            <h2 class="section-title">Frames</h2>
          </div>
          <div id="project-gallery" class="masonry"></div>
        </aside>
      </div>

      <div class="container nav-pager">
        <a id="prev-project" class="pager-link" href="#">
          <span class="section-label" style="font-size:.9rem;">← Previous Project</span>
          <strong class="prev-project-title">Previous</strong>
        </a>
        <a id="next-project" class="pager-link" href="#">
          <span class="section-label" style="font-size:.9rem;">Next Project →</span>
          <strong class="next-project-title">Next</strong>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <span>© <span id="year"></span> MofeOluwa Oladeji</span>
      <a href="index.html#work" class="inline-link">Back to Work</a>
    </div>
  </footer>

  <script src="./chrome.js"></script>
  <script src="./script.js"></script>
  <script src="./project-page.js"></script>
</body>
</html>
